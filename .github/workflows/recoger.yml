name: Recoger stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recoger
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: datos
          path: datos
      - name: Leer Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 recoger.py datos/historial.json
      - name: Guardar (sin acumular historial de git)
        working-directory: datos
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historial.json
          git commit --amend -m "datos" --quiet
          git push --force --quiet
